name: Build Release Installers

on:
  workflow_dispatch:  # Manual trigger only - prevents auto DOI creation
    inputs:
      version:
        description: 'Version tag (e.g., v1.0.0)'
        required: true
        default: 'v1.0.0'

env:
  PYINSTALLER_ARGS: >-
    --name TransiScope --onedir --windowed -y
    --collect-all napari
    --collect-all napari_builtins
    --collect-all napari_svg
    --collect-all vispy
    --collect-all superqt
    --collect-all magicgui
    --collect-all napari_console
    --collect-all npe2
    --collect-all imageio
    --hidden-import napari
    --hidden-import vispy.glsl
    --hidden-import vispy.io._data
    --copy-metadata imageio
    --copy-metadata napari
    --copy-metadata napari-svg
    --copy-metadata napari-console
    --copy-metadata vispy
    --copy-metadata scikit-image
    --copy-metadata tifffile
    --copy-metadata numpy
    --copy-metadata npe2
    --copy-metadata dask
    --copy-metadata scipy
    --copy-metadata pint
    --copy-metadata certifi

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install numpy scipy opencv-python-headless tifffile scikit-image "napari[all]" shapely ruptures matplotlib
          pip install -e .

      - name: Create launcher script
        run: |
          echo 'from TransiScope.gui_manager import main' > launch_transiscope.py
          echo 'if __name__ == "__main__":' >> launch_transiscope.py
          echo '    main()' >> launch_transiscope.py
        shell: bash

      - name: Build Windows executable
        run: |
          pyinstaller ${{ env.PYINSTALLER_ARGS }} launch_transiscope.py

      - name: Create ZIP archive
        run: |
          Compress-Archive -Path dist/TransiScope -DestinationPath TransiScope-Windows.zip
        shell: pwsh

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: TransiScope-Windows
          path: TransiScope-Windows.zip

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install numpy scipy opencv-python-headless tifffile scikit-image "napari[all]" shapely ruptures matplotlib
          pip install -e .

      - name: Create launcher script
        run: |
          cat > launch_transiscope.py << 'LAUNCHER'
          from TransiScope.gui_manager import main
          if __name__ == "__main__":
              main()
          LAUNCHER

      - name: Build macOS application
        run: |
          pyinstaller ${{ env.PYINSTALLER_ARGS }} launch_transiscope.py

      - name: Create ZIP archive
        run: |
          cd dist && zip -r ../TransiScope-macOS.zip TransiScope

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: TransiScope-macOS
          path: TransiScope-macOS.zip

  summary:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Summary
        run: |
          echo "## Build Complete!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Artifacts are ready for download:" >> $GITHUB_STEP_SUMMARY
          echo "- **TransiScope-Windows.zip** - Windows installer" >> $GITHUB_STEP_SUMMARY
          echo "- **TransiScope-macOS.zip** - macOS installer" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Next Steps:" >> $GITHUB_STEP_SUMMARY
          echo "1. Download artifacts from the 'Artifacts' section below" >> $GITHUB_STEP_SUMMARY
          echo "2. Go to [Releases](../../releases/tag/${{ inputs.version }})" >> $GITHUB_STEP_SUMMARY
          echo "3. Edit the release and upload the ZIP files as assets" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "This approach preserves your existing DOI without creating a new version."
